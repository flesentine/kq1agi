name: Truth engine certification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/truth-engine-certification.yml'
      - 'scripts/**'
      - 'web/certification-host.mjs'
      - 'docs/TRUTH_ENGINE_PHASE_1B.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/truth-engine-certification.yml'
      - 'scripts/**'
      - 'web/certification-host.mjs'
      - 'docs/TRUTH_ENGINE_PHASE_1B.md'

permissions:
  contents: read

jobs:
  certification-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test deterministic certification host
        run: node scripts/test_certification_host.mjs

      - name: Fetch exact AGILE source for both lanes
        run: |
          git clone https://github.com/lanceewing/agile-gdx.git agile-gdx-truth
          git clone https://github.com/lanceewing/agile-gdx.git agile-gdx-edited
          for dir in agile-gdx-truth agile-gdx-edited; do
            git -C "$dir" checkout 81c42ba63b3b7f5fb260d282592681c097d46da9
            test "$(git -C "$dir" rev-parse HEAD)" = "81c42ba63b3b7f5fb260d282592681c097d46da9"
          done

      - name: Instrument pristine truth lane
        run: |
          python3 scripts/instrument_truth_worker.py agile-gdx-truth
          python3 scripts/instrument_certification_runtime.py agile-gdx-truth
          python3 scripts/fix_certification_gwt_compat.py agile-gdx-truth
          python3 scripts/fix_certification_snapshot_barrier.py agile-gdx-truth
          git -C agile-gdx-truth add -N \
            core/src/main/java/com/agifans/agile/CertificationRandom.java \
            html/src/main/java/com/agifans/agile/gwt/CertificationSavedGameStore.java
          git -C agile-gdx-truth diff --check
          git -C agile-gdx-truth diff --name-only | sort | tee /tmp/truth-files.txt
          printf '%s\n' \
            core/src/main/java/com/agifans/agile/CertificationRandom.java \
            core/src/main/java/com/agifans/agile/Interpreter.java \
            html/src/main/java/com/agifans/agile/gwt/CertificationSavedGameStore.java \
            html/src/main/java/com/agifans/agile/worker/AgileWebWorker.java \
            | sort > /tmp/truth-expected.txt
          diff -u /tmp/truth-expected.txt /tmp/truth-files.txt

      - name: Assemble edited-lane room background
        run: |
          python3 scripts/assemble_room1_q60.py
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = list(Path('backgrounds').glob('room_001_hires.*'))
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one room_001_hires image, found: {files}')
          src = files[0]
          with Image.open(src) as image:
              image.load()
              if image.size != (1586, 992):
                  raise SystemExit(f'Wrong room 1 dimensions: {image.size}')
              clean = image.convert('RGB')
          out = Path('backgrounds/room_001_hires.png')
          clean.save(out, format='PNG', optimize=True)
          if src != out and src.exists():
              src.unlink()
          PY
          mkdir -p agile-gdx-edited/assets/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} agile-gdx-edited/assets/backgrounds/ \;

      - name: Apply current KQ1AGI runtime to edited lane
        run: |
          python3 scripts/patch_agile.py agile-gdx-edited
          python3 scripts/fix_background_mask.py agile-gdx-edited
          python3 scripts/fix_nested_zip.py agile-gdx-edited
          python3 scripts/fix_hires_background.py agile-gdx-edited
          python3 scripts/fix_room1_depth.py agile-gdx-edited
          python3 scripts/tune_room1_tree.py agile-gdx-edited
          python3 scripts/fix_room1_overlay_runtime.py agile-gdx-edited
          python3 scripts/fix_room1_tree_capsule.py agile-gdx-edited
          python3 scripts/fix_room1_tree_hard_collision.py agile-gdx-edited
          python3 scripts/fix_room1_tree_overlay_core.py agile-gdx-edited
          python3 scripts/add_scene_mask_editor.py agile-gdx-edited
          python3 scripts/fix_scene_mask_editor.py agile-gdx-edited
          python3 scripts/install_scene_mask_controls.py agile-gdx-edited
          python3 scripts/seed_room1_depth_matte.py agile-gdx-edited
          python3 scripts/adjust_room1_seed_alignment.py agile-gdx-edited
          python3 scripts/add_scene_mask_nudge.py agile-gdx-edited
          python3 scripts/add_brush_slider_controls.py agile-gdx-edited
          python3 scripts/add_scene_mask_pan.py agile-gdx-edited
          python3 scripts/add_scene_mask_fast_tools.py agile-gdx-edited
          python3 scripts/add_scene_mask_water.py agile-gdx-edited
          python3 scripts/fix_scene_mask_ui_sync.py agile-gdx-edited
          python3 scripts/fix_water_sprite_sink.py agile-gdx-edited
          python3 scripts/add_scene_object_move.py agile-gdx-edited
          python3 scripts/improve_scene_object_move.py agile-gdx-edited
          python3 scripts/fix_scene_object_move_bounds.py agile-gdx-edited
          python3 scripts/fix_debug_capture_framebuffer.py agile-gdx-edited
          python3 scripts/add_scene_mask_fall.py agile-gdx-edited
          cp web/coi-serviceworker.js agile-gdx-edited/html/webapp/coi-serviceworker.js
          git -C agile-gdx-edited diff --check

      - name: Add certification observer to edited lane
        run: |
          python3 scripts/instrument_truth_worker.py agile-gdx-edited
          python3 scripts/instrument_certification_runtime.py agile-gdx-edited
          python3 scripts/fix_certification_gwt_compat.py agile-gdx-edited
          python3 scripts/fix_certification_snapshot_barrier.py agile-gdx-edited
          git -C agile-gdx-edited diff --check

      - name: Verify dual-lane certification contracts
        run: |
          mkdir -p certification-artifact
          python3 scripts/check_certification_runtime.py \
            agile-gdx-truth agile-gdx-edited \
            certification-artifact/certification-runtime-report.json

      - name: Compile pristine truth worker
        run: |
          chmod +x agile-gdx-truth/gradlew
          cd agile-gdx-truth
          ./gradlew html:dist --no-daemon

      - name: Compile edited certification worker
        run: |
          chmod +x agile-gdx-edited/gradlew
          cd agile-gdx-edited
          ./gradlew html:dist --no-daemon

      - name: Verify compiled certification transports
        run: |
          for dir in agile-gdx-truth agile-gdx-edited; do
            test -f "$dir/html/build/dist/worker/worker.nocache.js"
            grep -R -q 'diagnosticTraceSAB' "$dir/html/build/dist/worker"
            grep -R -q 'certificationDigestSAB' "$dir/html/build/dist/worker"
            grep -R -q 'CertificationReady' "$dir/html/build/dist/worker"
            grep -R -q 'CertificationSnapshotReady' "$dir/html/build/dist/worker"
          done
          test -f web/certification-host.mjs
          grep -q "scope: 'semantic-v1'" web/certification-host.mjs
          grep -q 'async pulse()' web/certification-host.mjs
          grep -q '_synchronizeBarrierSnapshot' web/certification-host.mjs

      - name: Assemble Phase -1B artifact
        run: |
          mkdir -p certification-artifact/truth-worker certification-artifact/edited-worker
          cp -R agile-gdx-truth/html/build/dist/worker/. certification-artifact/truth-worker/
          cp -R agile-gdx-edited/html/build/dist/worker/. certification-artifact/edited-worker/
          cp web/certification-host.mjs certification-artifact/certification-host.mjs
          cp docs/TRUTH_ENGINE_PHASE_1B.md certification-artifact/README.md
          printf '%s\n' \
            'Phase -1B artifact only. No KQ1 game resources are included.' \
            'truth-worker = pinned pristine AGILE + certification instrumentation' \
            'edited-worker = current KQ1AGI runtime + same certification instrumentation' \
            > certification-artifact/ARTIFACT.txt
          find certification-artifact -maxdepth 2 -type f | sort

      - name: Upload certification core
        uses: actions/upload-artifact@v4
        with:
          name: truth-engine-certification
          path: certification-artifact