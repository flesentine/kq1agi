name: Build browser game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned AGILE source
        run: |
          git clone https://github.com/lanceewing/agile-gdx.git agile-gdx
          git -C agile-gdx checkout 81c42ba63b3b7f5fb260d282592681c097d46da9

      - name: Assemble verified room 1 q60 test background
        run: |
          python3 scripts/assemble_room1_q60.py
          ls -lh backgrounds/room_001_hires.*

      - name: Normalize room background to browser-safe PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = list(Path('backgrounds').glob('room_001_hires.*'))
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one room_001_hires image, found: {files}')

          src = files[0]
          with Image.open(src) as image:
              image.load()
              if image.size != (1586, 992):
                  raise SystemExit(f'Wrong room 1 dimensions: {image.size}')
              clean = image.convert('RGB')

          out = Path('backgrounds/room_001_hires.png')
          clean.save(out, format='PNG', optimize=True)
          if src != out and src.exists():
              src.unlink()

          with Image.open(out) as verify:
              verify.load()
              print(f'clean room background: {verify.size}, {out.stat().st_size:,} bytes, {verify.format}')
          PY

      - name: Add replacement room backgrounds
        run: |
          mkdir -p agile-gdx/assets/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} agile-gdx/assets/backgrounds/ \;
          echo '=== source room assets ==='
          find agile-gdx/assets/backgrounds -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Apply browser and real-background patch
        run: |
          python3 scripts/patch_agile.py agile-gdx
          python3 scripts/fix_background_mask.py agile-gdx
          python3 scripts/fix_nested_zip.py agile-gdx
          python3 scripts/fix_hires_background.py agile-gdx
          python3 scripts/fix_room1_depth.py agile-gdx
          python3 scripts/tune_room1_tree.py agile-gdx
          python3 scripts/fix_room1_overlay_runtime.py agile-gdx
          python3 scripts/fix_room1_tree_capsule.py agile-gdx
          python3 scripts/fix_room1_tree_hard_collision.py agile-gdx
          python3 scripts/fix_room1_tree_overlay_core.py agile-gdx
          python3 scripts/add_scene_mask_editor.py agile-gdx
          python3 scripts/fix_scene_mask_editor.py agile-gdx
          python3 scripts/install_scene_mask_controls.py agile-gdx
          python3 scripts/seed_room1_depth_matte.py agile-gdx
          python3 scripts/adjust_room1_seed_alignment.py agile-gdx
          python3 scripts/add_scene_mask_nudge.py agile-gdx
          python3 scripts/add_brush_slider_controls.py agile-gdx
          python3 scripts/add_scene_mask_pan.py agile-gdx
          python3 scripts/add_scene_mask_fast_tools.py agile-gdx
          python3 scripts/add_scene_mask_water.py agile-gdx
          python3 scripts/fix_scene_mask_ui_sync.py agile-gdx
          python3 scripts/fix_water_sprite_sink.py agile-gdx
          python3 scripts/add_scene_object_move.py agile-gdx
          python3 scripts/improve_scene_object_move.py agile-gdx
          python3 scripts/fix_debug_capture_framebuffer.py agile-gdx
          cp web/coi-serviceworker.js agile-gdx/html/webapp/coi-serviceworker.js

      - name: Verify scene mask editor patch landed
        run: |
          grep -q 'Input.Keys.F2' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'shiftAllMasks' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'drawBrushSlider' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'draggingBrushSlider' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'spacePan' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'paintLine' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'morphSelectedLayer' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'optionEraseHeld' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'layerVisible' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'Input.Keys.NUM_4' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'Input.Keys.NUM_5' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'drawMoveSelection' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'grabPad = 6' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'MOVE SPRITE: click a box once, then drag anywhere' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'private static final int WATER = 3' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'getSceneMaskWaterActive' agile-gdx/core/src/main/java/com/agifans/agile/VariableData.java
          grep -q 'getSceneVisualOffsetCount' agile-gdx/core/src/main/java/com/agifans/agile/VariableData.java
          grep -q 'effectiveControlPriority' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'objectVisualOffsetX' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'publishMoveObjects' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'WATER_VISUAL_MAX_SINK = 44' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'WATER_VISUAL_IMMERSION = 30' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'waterCount \* 2 > validCount' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'isWaterAnimationCel' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'for (int sink = from; sink <= to; sink++)' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskRuntime.java
          grep -q 'waterVisualPadding' agile-gdx/core/src/main/java/com/agifans/agile/AnimatedObject.java
          grep -q 'drawY is VISUAL ONLY' agile-gdx/core/src/main/java/com/agifans/agile/AnimatedObject.java
          grep -q '4 water' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'Browser PAINT/TEST control is authoritative' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          ! grep -q 'batch.draw(white, 218, 178, 44, 13)' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'getViewMagnification' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'ROOM1_OCCLUDER_RUNS' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'agi-scene-mask-editor-v3' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'preserveDrawingBuffer = true' agile-gdx/html/src/main/java/com/agifans/agile/gwt/GwtLauncher.java
          grep -q '__kq1agiVariableSAB' agile-gdx/html/src/main/java/com/agifans/agile/gwt/GwtVariableData.java
          echo 'scene mask editor, live-frame debug capture, easy sprite move, WATER trigger, and render-only swim/drown gating verified'

      - name: Build AGILE HTML5 app
        run: |
          chmod +x agile-gdx/gradlew
          cd agile-gdx
          ./gradlew html:dist --no-daemon

      - name: Verify room background reached HTML5 distribution
        run: |
          echo '=== room_001 files in HTML dist ==='
          FILE_HITS="$(find agile-gdx/html/build/dist -type f -iname '*room_001*' -print || true)"
          printf '%s\n' "$FILE_HITS"
          echo '=== files referencing room_001_hires in HTML dist ==='
          REF_HITS="$(grep -RIl --binary-files=without-match 'room_001_hires' agile-gdx/html/build/dist 2>/dev/null || true)"
          printf '%s\n' "$REF_HITS"
          if [ -z "$FILE_HITS" ] && [ -z "$REF_HITS" ]; then
            echo 'ERROR: room_001_hires did not reach the HTML5 distribution/preloader.'
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R agile-gdx/html/build/dist/. _site/
          cp agile-gdx/LICENSE _site/LICENSE-AGILE.txt
          cp "$GITHUB_WORKSPACE/web/index.html" _site/index.html
          cp "$GITHUB_WORKSPACE/web/coi-serviceworker.js" _site/coi-serviceworker.js
          sed -i 's/kq1agi-coi-retries-v4/kq1agi-coi-retries-v21/g; s/20260821-export-bg-1/20260824-debug-ui-4/g' _site/index.html
          python3 scripts/patch_web_brush_overlay.py _site/index.html
          python3 scripts/patch_web_debug_capture.py _site/index.html
          python3 scripts/patch_web_debug_ui.py _site/index.html
          python3 scripts/patch_web_debug_image_only.py _site/index.html
          python3 scripts/patch_web_debug_metadata.py _site/index.html
          mkdir -p _site/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} _site/backgrounds/ \;
          touch _site/.nojekyll

      - name: Verify editor controls in Pages artifact
        run: |
          grep -q 'id="paint-button"' _site/index.html
          grep -q '>DEBUG</button>' _site/index.html
          grep -q 'id="debug-snap-button"' _site/index.html
          grep -q 'id="move-sprite-button"' _site/index.html
          grep -q 'id="export-bg-button"' _site/index.html
          grep -q 'id="brush-control"' _site/index.html
          grep -q 'id="brush-size"' _site/index.html
          grep -q 'id="debug-capture"' _site/index.html
          grep -q '>COPY IMAGE</button>' _site/index.html
          grep -q 'debug-active' _site/index.html
          grep -q 'rgba(0,0,0,.78)' _site/index.html
          grep -q 'IMAGE COPIED — PASTE IT HERE' _site/index.html
          grep -q "new ClipboardItem({ 'image/png': png })" _site/index.html
          ! grep -q "'text/plain': new Blob" _site/index.html
          ! grep -q 'fillText(location.href' _site/index.html
          grep -q 'readAgiDebugLines' _site/index.html
          grep -q 'AGI room=' _site/index.html
          grep -q '__kq1agiVariableSAB' _site/index.html
          grep -q 'Cmd/Ctrl+Shift+D' _site/index.html
          grep -q 'Space + drag = pan' _site/index.html
          grep -q 'Tab shortcut' _site/index.html
          grep -q '20260824-debug-ui-4' _site/index.html
          grep -q 'room_001_hires.png' _site/index.html
          test -f _site/backgrounds/room_001_hires.png
          echo 'actual game-frame image debug capture with AGI metadata, always-visible DEBUG, easy MOVE SPRITE, WATER trigger, and clean background verified'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Report build/deploy status
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request';
            const buildOK = '${{ needs.build.result }}' === 'success';
            const deployOK = '${{ needs.deploy.result }}' === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: buildOK ? 'success' : 'failure',
              context: 'browser-build',
              description: buildOK ? 'HTML5 build succeeded' : 'HTML5 build failed'
            });

            if (!isPullRequest) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: deployOK ? 'success' : 'failure',
                context: 'browser-deploy',
                description: deployOK ? 'GitHub Pages deployment succeeded' : 'GitHub Pages deployment failed'
              });
            }

            if (!buildOK || (!isPullRequest && !deployOK)) {
              core.setFailed('Browser build/deploy failed');
            }
