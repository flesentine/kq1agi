name: Build browser game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned AGILE source
        run: |
          git clone https://github.com/lanceewing/agile-gdx.git agile-gdx
          git -C agile-gdx checkout 81c42ba63b3b7f5fb260d282592681c097d46da9

      - name: Assemble verified room 1 q60 test background
        run: |
          python3 scripts/assemble_room1_q60.py
          ls -lh backgrounds/room_001_hires.*

      - name: Normalize room background to browser-safe PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = list(Path('backgrounds').glob('room_001_hires.*'))
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one room_001_hires image, found: {files}')

          src = files[0]
          with Image.open(src) as image:
              image.load()
              if image.size != (1586, 992):
                  raise SystemExit(f'Wrong room 1 dimensions: {image.size}')
              clean = image.convert('RGB')

          out = Path('backgrounds/room_001_hires.png')
          clean.save(out, format='PNG', optimize=True)
          if src != out and src.exists():
              src.unlink()

          with Image.open(out) as verify:
              verify.load()
              print(f'clean room background: {verify.size}, {out.stat().st_size:,} bytes, {verify.format}')
          PY

      - name: Add replacement room backgrounds
        run: |
          mkdir -p agile-gdx/assets/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} agile-gdx/assets/backgrounds/ \;
          echo '=== source room assets ==='
          find agile-gdx/assets/backgrounds -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Apply browser and real-background patch
        run: |
          python3 scripts/patch_agile.py agile-gdx
          python3 scripts/fix_background_mask.py agile-gdx
          python3 scripts/fix_nested_zip.py agile-gdx
          python3 scripts/fix_hires_background.py agile-gdx
          python3 scripts/fix_room1_depth.py agile-gdx
          python3 scripts/tune_room1_tree.py agile-gdx
          python3 scripts/fix_room1_overlay_runtime.py agile-gdx
          python3 scripts/fix_room1_tree_capsule.py agile-gdx
          python3 scripts/fix_room1_tree_hard_collision.py agile-gdx
          python3 scripts/fix_room1_tree_overlay_core.py agile-gdx
          python3 scripts/add_scene_mask_editor.py agile-gdx
          python3 scripts/fix_scene_mask_editor.py agile-gdx
          python3 scripts/install_scene_mask_controls.py agile-gdx
          python3 scripts/seed_room1_depth_matte.py agile-gdx
          cp web/coi-serviceworker.js agile-gdx/html/webapp/coi-serviceworker.js

      - name: Verify scene mask editor patch landed
        run: |
          grep -q 'Input.Keys.F2' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'F2 PAINT' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'getViewMagnification' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'ROOM1_OCCLUDER_RUNS' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          grep -q 'agi-scene-mask-editor-v2' agile-gdx/core/src/main/java/com/agifans/agile/SceneMaskEditor.java
          echo 'scene mask editor controls and Room 1 AI matte verified in generated source'

      - name: Build AGILE HTML5 app
        run: |
          chmod +x agile-gdx/gradlew
          cd agile-gdx
          ./gradlew html:dist --no-daemon

      - name: Verify room background reached HTML5 distribution
        run: |
          echo '=== room_001 files in HTML dist ==='
          FILE_HITS="$(find agile-gdx/html/build/dist -type f -iname '*room_001*' -print || true)"
          printf '%s\n' "$FILE_HITS"
          echo '=== files referencing room_001_hires in HTML dist ==='
          REF_HITS="$(grep -RIl --binary-files=without-match 'room_001_hires' agile-gdx/html/build/dist 2>/dev/null || true)"
          printf '%s\n' "$REF_HITS"
          if [ -z "$FILE_HITS" ] && [ -z "$REF_HITS" ]; then
            echo 'ERROR: room_001_hires did not reach the HTML5 distribution/preloader.'
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R agile-gdx/html/build/dist/. _site/
          cp agile-gdx/LICENSE _site/LICENSE-AGILE.txt
          cp "$GITHUB_WORKSPACE/web/index.html" _site/index.html
          cp "$GITHUB_WORKSPACE/web/coi-serviceworker.js" _site/coi-serviceworker.js
          mkdir -p _site/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} _site/backgrounds/ \;
          touch _site/.nojekyll

      - name: Verify editor controls in Pages artifact
        run: |
          grep -q 'id="paint-button"' _site/index.html
          grep -q 'id="export-bg-button"' _site/index.html
          grep -q '20260821-export-bg-1' _site/index.html
          grep -q 'room_001_hires.png' _site/index.html
          test -f _site/backgrounds/room_001_hires.png
          echo 'PAINT, EXPORT BG, and clean Room 1 background verified in Pages artifact'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Report build/deploy status
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = context.eventName === 'pull_request';
            const buildOK = '${{ needs.build.result }}' === 'success';
            const deployOK = '${{ needs.deploy.result }}' === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: buildOK ? 'success' : 'failure',
              context: 'browser-build',
              description: buildOK ? 'HTML5 build succeeded' : 'HTML5 build failed'
            });

            if (!isPullRequest) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: deployOK ? 'success' : 'failure',
                context: 'browser-deploy',
                description: deployOK ? 'GitHub Pages deployment succeeded' : 'GitHub Pages deployment failed'
              });
            }

            if (!buildOK || (!isPullRequest && !deployOK)) {
              core.setFailed('Browser build/deploy failed');
            }
