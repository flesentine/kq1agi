name: Build browser game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned AGILE source
        run: |
          git clone https://github.com/lanceewing/agile-gdx.git agile-gdx
          git -C agile-gdx checkout 81c42ba63b3b7f5fb260d282592681c097d46da9

      - name: Add replacement room backgrounds
        run: |
          mkdir -p agile-gdx/assets/backgrounds
          find backgrounds -maxdepth 1 -type f \( -iname 'room_*.png' -o -iname 'room_*.jpg' -o -iname 'room_*.jpeg' \) -exec cp {} agile-gdx/assets/backgrounds/ \;

      - name: Apply browser and real-background patch
        run: |
          python3 scripts/patch_agile.py agile-gdx
          cp web/coi-serviceworker.js agile-gdx/html/webapp/coi-serviceworker.js

      - name: Build AGILE HTML5 app
        run: |
          chmod +x agile-gdx/gradlew
          cd agile-gdx
          ./gradlew html:dist --no-daemon

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R agile-gdx/html/build/dist/. _site/
          cp agile-gdx/LICENSE _site/LICENSE-AGILE.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
