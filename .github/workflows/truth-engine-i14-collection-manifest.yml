name: Truth engine I14 collection manifest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/truth-engine-i14-collection-manifest.yml'
      - 'scripts/test_certification_minimizer_checkpoint_collection_manifest.mjs'
      - 'web/certification-minimizer-checkpoint-collection-manifest.mjs'
      - 'web/certification-minimizer-checkpoint-collection-package.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-census.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-coverage.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-session-topology.mjs'
      - 'web/certification-minimizer-checkpoint-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/truth-engine-i14-collection-manifest.yml'
      - 'scripts/test_certification_minimizer_checkpoint_collection_manifest.mjs'
      - 'web/certification-minimizer-checkpoint-collection-manifest.mjs'
      - 'web/certification-minimizer-checkpoint-collection-package.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-census.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-coverage.mjs'
      - 'web/certification-minimizer-checkpoint-provenance-session-topology.mjs'
      - 'web/certification-minimizer-checkpoint-evidence.mjs'

permissions:
  contents: read

jobs:
  collection-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test deterministic collection manifest
        run: node scripts/test_certification_minimizer_checkpoint_collection_manifest.mjs
